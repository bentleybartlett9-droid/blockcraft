<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Blockcraft VR</title>
<style>
html,body{margin:0;width:100%;height:100%;background:#000;color:#fff;font-family:system-ui,sans-serif}
#loading{position:fixed;inset:0;display:grid;place-items:center;background:#000}
</style>
</head>
<body>
<div id="loading">Loading Blockcraft VR…</div>
<script>
(async()=>{
  try{
    const r=await fetch('./blockcraft-vr.html?v=exploration-update');
    if(!r.ok) throw new Error('Could not load blockcraft-vr.html');
    let html=await r.text();
    html=html.replace(/<\/body>/i,'<script src="./exploration-update.js?v=1"><\\/script></body>');
    document.open();
    document.write(html);
    document.close();
  }catch(err){
    document.getElementById('loading').textContent='Blockcraft failed to load: '+err.message;
    console.error(err);
  }
})();
</script>
</body>
</html>
